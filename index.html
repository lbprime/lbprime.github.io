    <style>
        :root {
            --bg: #f5f5f5;
            --card-bg: #ffffff;

            display: flex;
            flex-direction: column;

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 40px 24px 60px;

        /* Header */
        .header {
            text-align: center;
            padding: 48px 0 40px;
        }

        .header .logo {
            font-size: 36px;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: -0.5px;
            margin: 0 0 8px 0;
        }

        .header .subtitle {
            font-size: 15px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .header .divider {
            width: 48px;
            height: 3px;
            background: var(--accent);
            border-radius: 2px;
            margin: 16px auto 0;
            opacity: 0.3;
        }

        /* Clock */
        .clock {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 26px;
            animation: clock-in 0.5s ease both;
        }

        @keyframes clock-in {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .clock-time {
            display: flex;
            align-items: baseline;
            font-size: 46px;
            font-weight: 600;
            line-height: 1.1;
            letter-spacing: 1px;
            color: var(--text);
            font-variant-numeric: tabular-nums;
            font-feature-settings: 'tnum';
        }

        .clock-time .clock-sec {
            margin-left: 6px;
            font-size: 26px;
            font-weight: 700;
            color: var(--accent);
        }

        .clock-progress {
            width: 150px;
            height: 3px;
            border-radius: 2px;
            background: var(--border);
            overflow: hidden;
        }

        .clock-progress-bar {
            width: 100%;
            height: 100%;
            border-radius: 2px;
            background: var(--accent);
            transform-origin: left center;
            transform: scaleX(0);
            animation: clock-progress 1s linear infinite;
        }

        @keyframes clock-progress {
            from {
                transform: scaleX(0);
            }

            to {
                transform: scaleX(1);
            }
        }

        .clock-date {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .clock-date .clock-dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: #d4d4d8;
        }

        @media (prefers-reduced-motion: reduce) {

            .clock,
            .clock-progress-bar {
                animation: none;
            }

            .clock-progress-bar {
                transform: scaleX(1);
                opacity: 0.5;
            }
        }

        /* Stats */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-bottom: 36px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .stats-bar span strong {
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* Grid */
        .page-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
        }

        /* Card */
        .page-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 22px 70px 22px 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            border-left: 3px solid transparent;
            transition: border-left-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            position: relative;
        }

        .page-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
            border-left-color: var(--accent);
        }

        .page-card .card-name {
            font-size: 17px;
            font-weight: 600;
            color: var(--text);
            line-height: 1.4;
            transition: color 0.2s ease;
        }

        .page-card:hover .card-name {
            color: var(--accent);
        }

        .page-card .card-description {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: help;
            transition: color 0.2s ease;
        }

        .page-card:hover .card-description {
            color: var(--text);
        }

        .page-card .card-url {
            font-size: 12px;
            color: #c0c4cc;
            font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            transition: color 0.2s ease;
        }

        .page-card:hover .card-url {
            color: #b0b4bc;
        }

        .page-card .card-action {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%) translateX(6px);
            font-size: 13px;
            color: var(--accent);
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
        }

        .page-card:hover .card-action {
            opacity: 1;
            transform: translateY(-50%) translateX(0);
        }

        .page-card .card-action .arrow {
            display: inline-block;
            transition: transform 0.2s ease;
        }

        .page-card:hover .card-action .arrow {
            transform: translateX(3px);
        }

        /* Empty state */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }

        .empty-state .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.3;
        }

        .empty-state p {
            font-size: 14px;

        .empty-state .hint {

            opacity: 0.5;
        }

        /* Loading */
        .loading {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            padding: 80px 20px;
        }

        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Footer */
        .footer {
            margin-top: auto;
            text-align: center;
            padding: 24px;
            font-size: 12px;
            color: var(--text-muted);
            opacity: 0.5;
        }

        /* Share */
        .share-bar {
            display: flex;
            justify-content: center;
            margin-top: 18px;
        }

        .share-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 20px;
            font-size: 13.5px;
            font-weight: 500;
            font-family: inherit;
            color: var(--accent);
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
        }

        .share-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.25);

        }

        .share-btn:active {
            transform: translateY(0);

        .share-btn svg {

            height: 15px;

        /* Toast */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 40px;
            transform: translate(-50%, 16px);
            background: #1f2937;
            color: #ffffff;
            font-size: 13.5px;
            line-height: 1.5;
            padding: 11px 20px;
            border-radius: 8px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);

            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 100;
            max-width: calc(100vw - 40px);
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* Responsive */
        @media (max-width: 640px) {

            .page-grid {
                grid-template-columns: 1fr;
            }

            .page-card .card-action {
                opacity: 1;
                transform: translateY(-50%) translateX(0);
            }
        }
    </style>
</head>

    <script>
        /* 实时时钟：精确到秒，按整秒对齐刷新 */
        (function () {
            var hmEl = document.getElementById('clockHM');
            var secEl = document.getElementById('clockSec');
            var dateEl = document.getElementById('clockDate');
            var weekEl = document.getElementById('clockWeek');
            var timeEl = document.getElementById('clockTime');
            var barEl = document.getElementById('clockProgressBar');
            if (!hmEl || !secEl || !dateEl) return;

            var WEEKS = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            var timer = null;

            function pad(n) {
                return n < 10 ? '0' + n : '' + n;
            }

            function render() {
                var now = new Date();
                var h = pad(now.getHours());
                var m = pad(now.getMinutes());
                var s = pad(now.getSeconds());

                hmEl.textContent = h + ':' + m + ':';
                secEl.textContent = s;
                dateEl.textContent = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日';
                weekEl.textContent = WEEKS[now.getDay()];
                if (timeEl) {
                    timeEl.setAttribute('datetime', now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' +
                        pad(now.getDate()) + 'T' + h + ':' + m + ':' + s);
                }
            }

            // 对齐到下一个整秒，避免长时间运行产生累积误差
            function nextDelay() {
                return 1000 - (Date.now() % 1000) + 10;
            }

            function tick() {
                render();
                timer = setTimeout(tick, nextDelay());
            }

            function syncProgress() {
                if (barEl) barEl.style.animationDelay = '-' + (Date.now() % 1000) + 'ms';
            }

            function start() {
                if (timer !== null) return;
                render();
                syncProgress();
                timer = setTimeout(tick, nextDelay());
            }

            function stop() {
                if (timer === null) return;
                clearTimeout(timer);
                timer = null;
            }

            document.addEventListener('visibilitychange', function () {
                if (document.hidden) stop();
                else start();
            });

            start();
        })();
    </script>

    <script>
        (function () {
            var grid = document.getElementById('pageGrid');
            var pageCountEl = document.getElementById('pageCount');

            function renderCards(pages) {
                grid.innerHTML = '';

                if (!pages || pages.length === 0) {
                    grid.innerHTML =
                        '<div class="empty-state">' +
                        '<div class="empty-icon">&#128450;</div>' +
                        '<p>暂无工具页面</p>' +
                        '<p class="hint">在 pages/ 目录下添加 HTML 文件即可在此显示</p>' +
                        '</div>';
                    pageCountEl.textContent = '0';
                    return;
                }

                pageCountEl.textContent = pages.length;

                var html = '';
                pages.forEach(function (page) {
                    var descAttr = page.description ? ' title="' + page.description.replace(/"/g, '&quot;') + '"' : '';
                    var descHtml = page.description ? '<div class="card-description"' + descAttr + '>' + page.description + '</div>' : '';
                    html +=
                        '<a class="page-card" href="' + page.url + '">' +
                        '<div class="card-name">' + (page.name || '') + '</div>' +
                        descHtml +
                        '<span class="card-url">' + (page.url || '') + '</span>' +
                        '<span class="card-action">打开 <span class="arrow">&rarr;</span></span>' +
                        '</a>';
                });
                grid.innerHTML = html;
            }

            function renderError(msg) {
                grid.innerHTML =
                    '<div class="empty-state">' +
                    '<div class="empty-icon">&#9888;</div>' +
                    '<p>加载页面清单失败</p>' +
                    '<p class="hint">' + msg + '</p>' +
                    '<p class="hint" style="margin-top:8px;">请检查 tools.json 是否存在且格式正确</p>' +
                    '</div>';
                pageCountEl.textContent = '-';
            }

            fetch('/tools.json', { cache: 'no-cache' })
                .then(function (res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(function (tools) {
                    renderCards(Array.isArray(tools) ? tools : []);
                })
                .catch(function (err) {
                    renderError(err.message);
                });
        })();
    </script>

    <script>
        /* 一键分享：复制网站信息与链接到剪贴板 */
        (function () {
            var btn = document.getElementById('shareBtn');
            var toastEl = document.getElementById('toast');
            if (!btn) return;

            var SHARE_TITLE = 'LBN Tools - 实用在线工具集';
            var SHARE_DESC = 'JSON 格式化、JS 代码美化、SQL 格式化、时间戳转换等开发者常用工具，浏览器即开即用，数据本地处理更安全。';
            var SHARE_URL = 'https://lbprime.github.io/';

            var toastTimer = null;

            function toast(msg) {
                if (!toastEl) return;
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(function () {
                    toastEl.classList.remove('show');
                }, 2200);
            }

            function shareText() {
                return SHARE_TITLE + '\n' + SHARE_DESC + '\n' + SHARE_URL;
            }

            /* 兼容旧浏览器 / 非安全上下文的复制方案 */
            function fallbackCopy(text) {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.top = '-9999px';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                ta.setSelectionRange(0, ta.value.length);
                var ok = false;
                try {
                    ok = document.execCommand('copy');
                } catch (e) {
                    ok = false;
                }
                document.body.removeChild(ta);
                return ok;
            }

            function copyText(text) {
                if (navigator.clipboard && window.isSecureContext) {
                    return navigator.clipboard.writeText(text).then(function () {
                        return true;
                    }, function () {
                        return fallbackCopy(text);
                    });
                }
                return Promise.resolve(fallbackCopy(text));
            }

            btn.addEventListener('click', function () {
                copyText(shareText()).then(function (ok) {
                    if (ok) {
                        toast('已复制网站信息与链接，快去分享吧～');
                    } else {
                        toast('复制失败，请手动复制：' + SHARE_URL);
                    }
                });
            });
        })();
    </script>
