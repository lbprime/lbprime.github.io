  var found = [];
  lintCounts.js = 0;
  if (typeof JSHINT === 'undefined') return found;

  JSHINT(text, { esversion: 11, asi: true, undef: true, unused: 'vars', browser: true, devel: true });
  var errors = JSHINT.errors || [];
  for (var i = 0; i < errors.length; i++) {
    var e = errors[i];
    if (!e) continue;
    lintCounts.js++;
    var severity = (e.code && e.code[0] === 'W') ? 'warning' : 'error';
    found.push({
      from: CodeMirror.Pos(e.line - 1, Math.max(0, e.character - 1)),
      to: CodeMirror.Pos(e.line - 1, Math.max(0, e.character)),
      message: e.reason,
      severity: severity
    });
  }
  updateBadge('js');
  return found;
}

// --- CSS: CSSStyleSheet API + brace balance ---
function cssLint(text) {
  var found = [];
  lintCounts.css = 0;
  if (!text.trim()) { updateBadge('css'); return found; }

  if (typeof CSSStyleSheet !== 'undefined') {
    try {
      var sheet = new CSSStyleSheet();
      sheet.replaceSync(text);
    } catch(e) {
      lintCounts.css++;
      var line = 0, col = 0;
      var m = (e.message || '').match(/at\s+(\d+):(\d+)/);
      if (m) { line = parseInt(m[1]) - 1; col = parseInt(m[2]) - 1; }
      found.push({
        from: CodeMirror.Pos(line, Math.max(0, col)),
        to: CodeMirror.Pos(line, Math.max(0, col + 1)),
        message: e.message || 'CSS parse error',
        severity: 'error'
      });
      updateBadge('css');
      return found;
    }
  }

  var brace = 0, lines = text.split('\n');
  for (var i = 0; i < lines.length; i++) {
    for (var j = 0; j < lines[i].length; j++) {
      if (lines[i][j] === '{') brace++;
      if (lines[i][j] === '}') brace--;
      if (brace < 0) {
        lintCounts.css++;
        found.push({
          from: CodeMirror.Pos(i, j), to: CodeMirror.Pos(i, j + 1),
          message: '多余的 "}"', severity: 'error'
        });
        brace = 0;
      }
    }
  }
  if (brace > 0) {
    lintCounts.css++;
    found.push({
      from: CodeMirror.Pos(lines.length - 1, 0),
      to: CodeMirror.Pos(lines.length - 1, 1),
      message: '缺少 ' + brace + ' 个 "}"', severity: 'error'
    });
  }
  updateBadge('css');
  return found;
}

// --- HTML: tag balance ---
function htmlLint(text) {
  var found = [];
  lintCounts.html = 0;
  if (!text.trim()) { updateBadge('html'); return found; }

  var voidTags = { area:1,base:1,br:1,col:1,embed:1,hr:1,img:1,input:1,link:1,meta:1,param:1,source:1,track:1,wbr:1 };
  var stack = [];
  var re = /<\/?([a-zA-Z][a-zA-Z0-9]*)\b[^>]*>/g;
  var m;
  while ((m = re.exec(text)) !== null) {
    var tag = m[1].toLowerCase();
    if (voidTags[tag]) continue;
    if (m[0][1] === '/') {
      if (stack.length === 0) {
        var p = posAt(text, m.index);
        lintCounts.html++;
        found.push({
          from: CodeMirror.Pos(p.line, p.ch), to: CodeMirror.Pos(p.line, p.ch + m[0].length),
          message: '多余的 </' + tag + '>', severity: 'error'
        });
      } else if (stack[stack.length - 1] !== tag) {
        var p2 = posAt(text, m.index);
        lintCounts.html++;
        found.push({
          from: CodeMirror.Pos(p2.line, p2.ch), to: CodeMirror.Pos(p2.line, p2.ch + m[0].length),
          message: '标签不匹配 </' + tag + '>，期望 </' + stack[stack.length - 1] + '>', severity: 'error'
        });
      } else {
        stack.pop();
      }
    } else if (!/\/\s*>$/.test(m[0])) {
      stack.push(tag);
    }
  }
  for (var i = 0; i < stack.length; i++) {
    lintCounts.html++;
    found.push({
      from: CodeMirror.Pos(text.split('\n').length - 1, 0),
      to: CodeMirror.Pos(text.split('\n').length - 1, 1),
      message: '未闭合的标签 <' + stack[i] + '>', severity: 'warning'
    });
  }
  updateBadge('html');
  return found;
}

function posAt(text, idx) {
  var before = text.substring(0, idx);
  var lines = before.split('\n');
  return { line: lines.length - 1, ch: lines[lines.length - 1].length };
}

// ============================================================
//  Register CM5 Lint Helpers
// ============================================================
CodeMirror.registerHelper('lint', 'javascript', jsLint);
CodeMirror.registerHelper('lint', 'css', cssLint);
CodeMirror.registerHelper('lint', 'htmlmixed', htmlLint);

// ============================================================
//  Initialize Editors
// ============================================================
function cmOpts(extra) {
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  var opts = {
    theme: isDark ? 'dracula' : 'default',
    lineNumbers: true,
    matchBrackets: true,
    autoCloseBrackets: true,
    styleActiveLine: true,
    foldGutter: true,
    gutters: ['CodeMirror-lint-markers','CodeMirror-linenumbers','CodeMirror-foldgutter'],
    lint: true,
    indentUnit: 2,
    tabSize: 2,
    indentWithTabs: false,
    extraKeys: {
      'Ctrl-Enter': runCode, 'Cmd-Enter': runCode,
      'Ctrl-S': runCode,     'Cmd-S': runCode
    }
  };
  if (extra) { Object.keys(extra).forEach(function(k){opts[k]=extra[k];}); }
  return opts;
}

editors.html = CodeMirror(document.getElementById('pane-html'), cmOpts({
  mode: 'htmlmixed', value: DEFAULT_HTML
}));

editors.css = CodeMirror(document.getElementById('pane-css'), cmOpts({
  mode: 'css', value: DEFAULT_CSS
}));

editors.js = CodeMirror(document.getElementById('pane-js'), cmOpts({
  mode: 'javascript', value: DEFAULT_JS
}));

// Change handlers
['html','css','js'].forEach(function(lang){
  editors[lang].on('change', function(){
    if (autoRun) { clearTimeout(runTimer); runTimer = setTimeout(runCode, 500); }
    updateStats();
    saveStorage();
  });
});

// ============================================================
//  Badge & Stats
// ============================================================
function updateBadge(lang) {
  var badge = document.querySelector('.badge[data-for="' + lang + '"]');
  if (!badge) return;
  var count = lintCounts[lang];
  badge.textContent = count;
  if (count > 0) {
    badge.classList.remove('hidden');
    badge.classList.remove('warn');
    badge.classList.add('error');
  } else {
    badge.classList.add('hidden');
  }
}

function updateStats() {
  var elHtml = $('#stat-html'); if (elHtml) elHtml.textContent = editors.html.lineCount();
  var elCss = $('#stat-css'); if (elCss) elCss.textContent = editors.css.lineCount();
  var elJs = $('#stat-js'); if (elJs) elJs.textContent = editors.js.lineCount();
}

// ============================================================
//  Build & Run
// ============================================================
function runCode() {
  clearTimeout(runTimer);
  consoleEntries = [];
  renderConsole();

  var html = editors.html.getValue();
  var css = editors.css.getValue();
  var js = editors.js.getValue();
  var safeJs = js.replace(/<\/script/gi, '<\\/script');

  // Console-capture IIFE — injects into iframe to forward console calls to parent
  var capture = [
    '(function(){',
    'var m=["log","error","warn","info","debug"],o={};',
    'm.forEach(function(k){o[k]=console[k];',
    'console[k]=function(){',
    'try{o[k].apply(console,arguments)}catch(e){}',
    'try{parent.postMessage({',
    '__jsr:1,type:"c",method:k,',
    'args:Array.prototype.slice.call(arguments).map(function(a){',
    'try{',
    'if(a===null)return"null";',
    'if(a===undefined)return"undefined";',
    'if(typeof a==="object")return JSON.stringify(a,null,2);',
    'return String(a)',
    '}catch(e){return String(a)}',
    '})},',
    '"*")}catch(e){}',
    '});',
    'window.onerror=function(msg,url,line,col,err){',
    'try{parent.postMessage({',
    '__jsr:1,type:"c",method:"error",',
    'args:[msg+(line?" (line "+line+")":"")]},',
    '"*")}catch(e){}',
    'return false',
    '};',
    'window.addEventListener("unhandledrejection",function(e){',
    'try{parent.postMessage({',
    '__jsr:1,type:"c",method:"error",',
    'args:["Promise: "+(e.reason&&e.reason.message||String(e.reason))]},',
    '"*")}catch(e){}',
    '});',
    '})();'
  ].join('\n');

  // Use \x3C hex escapes so HTML parser never sees literal angle brackets in raw source
  var S  = '\x3Cscript\x3E';
  var SE = '\x3C/script\x3E';
  var srcdoc = [
    '\x3C!DOCTYPE html\x3E',
    '\x3Chtml\x3E',
    '\x3Chead\x3E',
    '\x3Cmeta charset="UTF-8"\x3E',
    '\x3Cstyle\x3E',
    css,
    '\x3C/style\x3E',
    S,
    capture,
    SE,
    '\x3C/head\x3E',
    '\x3Cbody\x3E',
    html,
    S,
    'try{',
    safeJs,
    '}catch(e){console.error(e.message)}',
    SE,
    '\x3C/body\x3E',
    '\x3C/html\x3E'
  ].join('\n');

  var iframe = document.getElementById('preview-iframe');
  if (iframe) iframe.srcdoc = srcdoc;

  var st = $('#status-text'); if (st) st.textContent = 'Output updated';
  setTimeout(function(){ var st2 = $('#status-text'); if (st2) st2.textContent = 'Ready'; }, 2000);
}

// ============================================================
//  Console capture
// ============================================================
window.addEventListener('message', function(e){
  if (!e.data || !e.data.__jsr) return;
  if (e.data.type !== 'c') return;

  var method = e.data.method || 'log';
  var args = e.data.args || [];
  consoleEntries.push({ method: method, text: args.join(' ') });
  if (consoleEntries.length > 300) { consoleEntries = consoleEntries.slice(-300); }
  renderConsole();
  updateConsoleBadge();
});

function renderConsole() {
  var el = $('#console-output');
  if (!el) return;
  if (consoleEntries.length === 0) {
    el.innerHTML = '<div class="console-empty">Run code to see console output</div>';
    return;
  }
  var h = '';
  for (var i = 0; i < consoleEntries.length; i++) {
    var e = consoleEntries[i];
    var cls = e.method === 'error' ? ' err' : (e.method === 'warn' ? ' wrn' : '');
    h += '<div class="console-entry' + cls + '"><span class="console-method ' + e.method + '">' +
      e.method + '</span><span class="console-body-text">' + escHtml(e.text) + '</span></div>';
  }
  el.innerHTML = h;
  el.scrollTop = el.scrollHeight;
}

function updateConsoleBadge() {
  var errs = 0;
  for (var i = 0; i < consoleEntries.length; i++) {
    if (consoleEntries[i].method === 'error') errs++;
  }
}

function clearConsole() {
  consoleEntries = [];
  renderConsole();
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ============================================================
//  Format / Minify
// ============================================================
function formatJs() {
  var code = editors.js.getValue();
  if (!code.trim()) return;
  try {
    var formatted = window.js_beautify(code, {
      indent_size: 2, indent_char: ' ', max_preserve_newlines: 2,
      preserve_newlines: true, brace_style: 'collapse',
      space_before_conditional: true, unescape_strings: false
    });
    editors.js.setValue(formatted);
    var st = $('#status-text'); if (st) st.textContent = 'JS 格式化完成';
  } catch(e) {
    var st2 = $('#status-text'); if (st2) st2.textContent = '格式化失败: ' + e.message;
  }
}

function minifyJs() {
  var code = editors.js.getValue();
  if (!code.trim()) return;
  try {
    var result = window.Terser.minify_sync(code);
    if (result.error) {
      var st = $('#status-text'); if (st) st.textContent = '压缩失败: ' + result.error.message;
      return;
    }
    editors.js.setValue(result.code);
    var st2 = $('#status-text'); if (st2) st2.textContent = 'JS 压缩完成';
  } catch(e) {
    var st3 = $('#status-text'); if (st3) st3.textContent = '压缩失败: ' + e.message;
  }
}

// ============================================================
//  Tab switching
// ============================================================
var editorTabsEl = $('#editor-tabs');
if (editorTabsEl) {
  editorTabsEl.addEventListener('click', function(e){
    var tab = e.target.closest('.runner-tab');
    if (!tab) return;
    var pane = tab.getAttribute('data-pane');
    if (!pane) return;
    switchEditorTab(pane);
  });
}

function switchEditorTab(pane) {
  activePane = pane;
  $$('#editor-tabs .runner-tab').forEach(function(t){
    t.classList.toggle('active', t.getAttribute('data-pane') === pane);
  });
  $$('.editor-pane').forEach(function(p){ p.classList.remove('active'); });
  var el = document.getElementById('pane-' + pane);
  if (el) { el.classList.add('active'); }
  if (editors[pane]) {
    editors[pane].refresh();
    editors[pane].focus();
  }
}

// ============================================================
//  Resize (horizontal: editor|output  +  vertical: preview|console)
// ============================================================
var resizeState = null; // { dir:'h'|'v', rect:DOMRect, el:HTMLElement, raf:number }

function resizeRAF(e) {
  if (!resizeState) return;
  var clientX, clientY;
  if (e.touches) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
  else { clientX = e.clientX; clientY = e.clientY; }

  var rs = resizeState, rect = rs.rect;

  if (rs.dir === 'h') {
    var pct;
    if (window.innerWidth <= 768) {
      pct = Math.max(20, Math.min(80, ((clientY - rect.top) / (rect.height - 5)) * 100));
      rs.el.style.height = pct + '%'; rs.el.style.width = '100%';
    } else {
      pct = Math.max(20, Math.min(80, ((clientX - rect.left) / (rect.width - 5)) * 100));
      rs.el.style.width = pct + '%'; rs.el.style.height = '100%';
    }
  } else {
    // Vertical: preview height within output panel
    var y = clientY - rect.top;
    var pct = Math.max(10, Math.min(90, (y / (rect.height - 5)) * 100));
    rs.el.style.height = pct + '%';
  }
}

function onResizeMove(e) {
  if (!resizeState) return;
  if (resizeState.raf) return; // rAF already scheduled
  resizeState.raf = requestAnimationFrame(function(){
    resizeState.raf = null;
    resizeRAF(e);
    if (resizeState && resizeState.dir === 'h' && editors[activePane]) {
      editors[activePane].refresh();
    }
  });
}

function startResize(dir, e) {
  var overlay = $('#resize-overlay');
  var handle, el, cursor;

  if (dir === 'h') {
    handle = $('#resize-handle');
    el = $('#panel-editor');
    cursor = window.innerWidth <= 768 ? 'row-resize' : 'col-resize';
    var main = $('#runner-main');
    if (!handle || !el || !main) return;
    handle.classList.add('active');
    resizeState = { dir: 'h', rect: main.getBoundingClientRect(), el: el, raf: null };
  } else {
    handle = $('#output-divider');
    el = $('#output-preview');
    cursor = 'row-resize';
    var panelOut = $('#panel-output');
    if (!handle || !el || !panelOut) return;
    handle.classList.add('active');
    resizeState = { dir: 'v', rect: panelOut.getBoundingClientRect(), el: el, raf: null };
  }

  if (overlay) { overlay.classList.add('active'); overlay.style.cursor = cursor; }
  document.body.classList.add('resize-active');
  document.body.style.cursor = cursor;
  e.preventDefault();
}

function stopResize() {
  if (!resizeState) return;
  if (resizeState.raf) { cancelAnimationFrame(resizeState.raf); }

  var handle = resizeState.dir === 'h' ? $('#resize-handle') : $('#output-divider');
  if (handle) handle.classList.remove('active');

  var overlay = $('#resize-overlay');
  if (overlay) { overlay.classList.remove('active'); overlay.style.cursor = ''; }

  document.body.classList.remove('resize-active');
  document.body.style.cursor = '';
  resizeState = null;
}

// Mouse events
var hHandle = $('#resize-handle');
if (hHandle) { hHandle.addEventListener('mousedown', function(e){ startResize('h', e); }); }

var vHandle = $('#output-divider');
if (vHandle) { vHandle.addEventListener('mousedown', function(e){ startResize('v', e); }); }

document.addEventListener('mousemove', onResizeMove);
document.addEventListener('mouseup', stopResize);

// Touch events
if (hHandle) { hHandle.addEventListener('touchstart', function(e){ startResize('h', e); }); }
if (vHandle) { vHandle.addEventListener('touchstart', function(e){ startResize('v', e); }); }

document.addEventListener('touchmove', onResizeMove);
document.addEventListener('touchend', stopResize);

// ============================================================
//  Theme
// ============================================================
function toggleTheme() {
  var html = document.documentElement;
  var cur = html.getAttribute('data-theme');
  var next = cur === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);

  var cmTheme = next === 'dark' ? 'dracula' : 'default';
  Object.keys(editors).forEach(function(k){
    if (editors[k]) editors[k].setOption('theme', cmTheme);
  });

  var btn = $('#btn-theme'); if (btn) btn.textContent = next === 'dark' ? '☀' : '☾';
  try { localStorage.setItem('jsrunner_theme', next); } catch(e) {}
}

var btnTheme = $('#btn-theme');
if (btnTheme) btnTheme.addEventListener('click', toggleTheme);

// Restore saved theme
(function(){
  try {
    if (localStorage.getItem('jsrunner_theme') === 'dark') toggleTheme();
  } catch(e) {}
})();

// ============================================================
//  Auto-run toggle
// ============================================================
var btnAuto = $('#btn-auto');
if (btnAuto) {
  btnAuto.addEventListener('click', function(){
    autoRun = !autoRun;
    btnAuto.classList.toggle('active', autoRun);
    btnAuto.textContent = autoRun ? 'Auto' : 'Manual';
    try { localStorage.setItem('jsrunner_auto', String(autoRun)); } catch(e) {}
  });
}

(function(){
  try {
    if (localStorage.getItem('jsrunner_auto') === 'false') {
      autoRun = false;
      var b = $('#btn-auto');
      if (b) { b.classList.remove('active'); b.textContent = 'Manual'; }
    }
  } catch(e) {}
})();

// ============================================================
//  Button bindings
// ============================================================
var btnRun = $('#btn-run'); if (btnRun) btnRun.addEventListener('click', runCode);
var btnClear = $('#btn-clear-console'); if (btnClear) btnClear.addEventListener('click', clearConsole);
var btnFmt = $('#btn-format-js'); if (btnFmt) btnFmt.addEventListener('click', formatJs);
var btnMin = $('#btn-minify-js'); if (btnMin) btnMin.addEventListener('click', minifyJs);

// Donate
var donateWx = $('#donate-wx'); if (donateWx) donateWx.addEventListener('click', function(){ $('#donate-dialog').classList.add('active'); });
var donateZfb = $('#donate-zfb'); if (donateZfb) donateZfb.addEventListener('click', function(){ $('#donate-dialog').classList.add('active'); });
var donateClose = $('#donate-dialog-close'); if (donateClose) donateClose.addEventListener('click', function(){ $('#donate-dialog').classList.remove('active'); });
var donateOverlay = $('#donate-dialog'); if (donateOverlay) donateOverlay.addEventListener('click', function(e){ if (e.target === donateOverlay) donateOverlay.classList.remove('active'); });

// ============================================================
//  Keyboard shortcuts
// ============================================================
document.addEventListener('keydown', function(e){
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  var ctrl = e.ctrlKey || e.metaKey;
  if (ctrl && e.key === '1') { e.preventDefault(); switchEditorTab('html'); }
  if (ctrl && e.key === '2') { e.preventDefault(); switchEditorTab('css'); }
  if (ctrl && e.key === '3') { e.preventDefault(); switchEditorTab('js'); }
  if (ctrl && (e.key === 'Enter' || e.key === 's')) { e.preventDefault(); runCode(); }
});

// ============================================================
//  Storage
// ============================================================
function saveStorage() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      html: editors.html.getValue(), css: editors.css.getValue(), js: editors.js.getValue()
    }));
  } catch(e) {}
}

function restoreStorage() {
  try {
    var saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved) {
      if (saved.html) editors.html.setValue(saved.html);
      if (saved.css) editors.css.setValue(saved.css);
      if (saved.js) editors.js.setValue(saved.js);
      return true;
    }
  } catch(e) {}
  return false;
}

// ============================================================
//  Init
// ============================================================
function init() {
  restoreStorage();
  updateStats();
  runCode();
  setTimeout(function(){
    if (editors[activePane]) {
      editors[activePane].refresh();
      editors[activePane].focus();
    }
  }, 100);
}

// Wait for CodeMirror to be fully available before init
if (typeof CodeMirror !== 'undefined') {
  init();
} else {
  // Fallback: wait for CodeMirror to load
  var checkCm = setInterval(function(){
    if (typeof CodeMirror !== 'undefined') {
      clearInterval(checkCm);
      init();
    }
  }, 50);
  // Timeout after 5 seconds
  setTimeout(function(){ clearInterval(checkCm); }, 5000);
}

})();
