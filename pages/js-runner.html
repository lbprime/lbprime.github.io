// ============================================================
//  CSS Formatter (kept verbatim)

function _formatCss(css) {
  // Remove leading/trailing whitespace while preserving internal structure
  css = css.trim();
  if (!css) return css;

  var result = '';
  var indent = 0;
  var indentStr = '  ';
  // Tokenize: comments, blocks, rules
  var i = 0;
  while (i < css.length) {
    // Comment
    if (css[i] === '/' && css[i+1] === '*') {
      var end = css.indexOf('*/', i + 2);
      if (end === -1) { result += css.substring(i); break; }
      result += '\n' + indentStr.repeat(indent) + css.substring(i, end + 2);
      i = end + 2;
      continue;
    }
    // Opening brace
    if (css[i] === '{') {
      result += ' {\n';
      indent++;
      i++;
      // Skip whitespace after {
      while (i < css.length && /\s/.test(css[i])) i++;
      continue;
    }
    // Closing brace
    if (css[i] === '}') {
      indent = Math.max(0, indent - 1);
      result += '\n' + indentStr.repeat(indent) + '}';
      i++;
      // Skip whitespace after }
      while (i < css.length && /\s/.test(css[i])) i++;
      continue;
    }
    // Semicolon (property separator)
    if (css[i] === ';') {
      result += ';\n' + indentStr.repeat(indent);
      i++;
      while (i < css.length && /\s/.test(css[i])) i++;
      continue;
    }
    // Comma (selector separator)
    if (css[i] === ',') {
      result += ',\n' + indentStr.repeat(indent);
      i++;
      while (i < css.length && /\s/.test(css[i])) i++;
      continue;
    }
    // Colon (property-value separator)
    if (css[i] === ':') {
      result += ': ';
      i++;
      while (i < css.length && /\s/.test(css[i])) i++;
      continue;
    }
    // Whitespace - collapse to single space except at line start
    if (/\s/.test(css[i])) {
      // Check if we just had a newline from a ; or }
      if (result && result[result.length - 1] === '\n') {
        // Already at line start, just skip whitespace
        i++;
        continue;
      }
      var ws = '';
      while (i < css.length && /\s/.test(css[i])) { ws += css[i]; i++; }
      if (ws.indexOf('\n') !== -1) {
        result += '\n' + indentStr.repeat(indent);
      } else if (result && result[result.length - 1] !== ' ') {
        result += ' ';
      }
      continue;
    }
    // Regular character
    result += css[i];
    i++;
  }

  return result.replace(/\n\s*\n\s*\n/g, '\n\n').replace(/^\n+/, '').trim();
}

    scriptBlocks.push(open + '\n' + formatted.trim() + '\n' + close);
    return '\x00SCRIPT' + idx + '\x00';

    // DOCTYPE

      result += (result ? '\n' : '') + tag;
      prevType = 'tag';
      continue;
    }

    // Closing tag
    if (tag[1] === '/') {
      indent = Math.max(0, indent - 1);
      result += '\n' + indentStr.repeat(indent) + tag;
      prevType = 'tag';
      continue;
    }

    // Self-closing tag
    if (/\/\s*>$/.test(tag)) {
      result += '\n' + indentStr.repeat(indent) + tag;
      prevType = 'tag';
      continue;
    }

    // Get tag name
    var tagMatch = tag.match(/^<(\w+)/);
    if (!tagMatch) {
      result += '\n' + indentStr.repeat(indent) + tag;
      prevType = 'tag';
      continue;
    }

    // Void element
    if (voidTags[tagName]) {
      result += '\n' + indentStr.repeat(indent) + tag;
      prevType = 'tag';
      continue;
    }

    // Opening tag
    result += '\n' + indentStr.repeat(indent) + tag;
    prevType = 'tag';

    // Check if this opening tag actually gets closed later in the source
    // Only increase indent if there's content between open and close
    indent++;

  return result.replace(/^\n+/, '').trim() + '\n';
}

// ============================================================
//  Minify (compress entire HTML document)
// ============================================================
function _minifyCss(css) {
  // Remove comments
  css = css.replace(/\/\*[\s\S]*?\*\//g, '');
  // Collapse all whitespace sequences
  css = css.replace(/\s+/g, ' ');
  // Remove spaces around structural characters
  css = css.replace(/\s*([{}:;,>+~()])\s*/g, '$1');
  // Remove unnecessary semicolons before closing brace
  css = css.replace(/;\s*}/g, '}');
  // Remove leading/trailing whitespace from selectors and values
  css = css.replace(/^\s+|\s+$/g, '');
  return css;
}

function minifyHtml(html) {
  var result = html;

  // === Step 1: Protect <textarea>, <pre>, <code> content ===
  var preserveBlocks = [];

    var idx = preserveBlocks.length;
    preserveBlocks.push(m);
    return '\x00PRESERVE' + idx + '\x00';
  });

  // === Step 2: Remove HTML comments (keep IE conditional comments) ===
  result = result.replace(new RegExp('<!--(?!\\[if\\s)[\\s\\S]*?-->', 'g'), '');

  // === Step 3: Minify inline script blocks ===
  var scriptBlockRe = new RegExp('(<script\\b[^>]*>)([\\s\\S]*?)(<\\/script>)', 'gi');
  result = result.replace(scriptBlockRe, function(m, open, content, close) {
    // Skip scripts with src attribute
    if (/src\s*=/.test(open)) return m;

    if (typeMatch && !/^(text\/javascript|module|application\/javascript)$/i.test(typeMatch[1])) return m;

    var minified = content;
    if (typeof Terser !== 'undefined' && Terser.minify_sync) {
      try {
        var result = Terser.minify_sync(content);
        if (result.code) minified = result.code;
      } catch(e) { /* keep original */ }

  // === Step 4: Minify inline style blocks ===
  var styleBlockRe = new RegExp('(<style\\b[^>]*>)([\\s\\S]*?)(<\\/style>)', 'gi');
  result = result.replace(styleBlockRe, function(m, open, content, close) {
    return open + _minifyCss(content) + close;
  });

  // === Step 5: Collapse HTML whitespace ===
  // Remove whitespace between tags
  result = result.replace(/>\s+</g, '><');
  // Collapse multiple spaces into one (in text nodes)
  result = result.replace(/\s{2,}/g, ' ');
  // Remove leading/trailing whitespace on each line
  result = result.replace(/^\s+|\s+$/gm, '');

  // === Step 6: Restore preserved blocks ===
  result = result.replace(/\x00PRESERVE(\d+)\x00/g, function(m, idx) {
    var block = preserveBlocks[parseInt(idx)];
    // Minify preserved blocks too (just collapse whitespace between their tags)
    return block.replace(/>\s+</g, '><');
  });

  // Remove blank lines
  result = result.replace(/\n\s*\n/g, '\n');

  return result.trim();
}

//  Vue App
// ============================================================
var _v = Vue;
var createApp = _v.createApp, ref = _v.ref, onMounted = _v.onMounted;

var app = createApp({
  setup: function () {
    // ---- 状态 ----
    var autoRun = ref(true);
    var totalLines = ref(0);
    var statusText = ref('Ready');
    var donateVisible = ref(false);
    var themeBtn = ref('☀');

    var editorBody = ref(null);
    var runnerMain = ref(null);
    var panelEditor = ref(null);
    var resizeHandle = ref(null);
    var resizeOverlay = ref(null);
    var previewFrame = ref(null);

    var editor = null;
    var runTimer = null;
    var resizeState = null;
    var STORAGE_KEY = 'jsrunner_v4';

    // ---- 编辑器选项 ----
    function cmOpts() {
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      return {
        mode: 'htmlmixed',
        theme: isDark ? 'dracula' : 'default',
        lineNumbers: true,
        matchBrackets: true,
        autoCloseBrackets: true,
        styleActiveLine: true,
        foldGutter: true,
        gutters: ['CodeMirror-linenumbers','CodeMirror-foldgutter'],
        indentUnit: 2,
        tabSize: 2,
        indentWithTabs: false,
        extraKeys: {
          'Ctrl-Enter': runCode, 'Cmd-Enter': runCode,
          'Ctrl-S': runCode,     'Cmd-S': runCode,
          'Shift-Alt-F': formatCode
        }
      };
    }

    // ---- 状态更新 ----
    function updateStats() {
      totalLines.value = editor.lineCount();
    }

    // ---- 运行 ----
    function runCode() {
      clearTimeout(runTimer);
      var frame = previewFrame.value;
      if (frame) frame.srcdoc = editor.getValue();
      statusText.value = 'Output updated';
      setTimeout(function(){
        if (statusText.value === 'Output updated') statusText.value = 'Ready';
      }, 2000);
    }

    // ---- 格式化 ----
    function formatCode() {
      var code = editor.getValue();
      if (!code.trim()) return;
      try {
        var formatted = formatHtml(code);
        editor.setValue(formatted);
        statusText.value = '格式化完成';
      } catch(e) {
        statusText.value = '格式化失败: ' + e.message;
      }
    }

    // ---- 压缩 ----
    function minifyCode() {
      var code = editor.getValue();
      if (!code.trim()) return;
      try {
        var minified = minifyHtml(code);
        editor.setValue(minified);
        statusText.value = '压缩完成';
      } catch(e) {
        statusText.value = '压缩失败: ' + e.message;
      }
    }

    // ---- Resize (horizontal: editor | output) ----
    function resizeRAF(e) {
      if (!resizeState) return;
      var clientX, clientY;
      if (e.touches) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
      else { clientX = e.clientX; clientY = e.clientY; }

      var rs = resizeState, rect = rs.rect;

      if (window.innerWidth <= 768) {
        var pct = Math.max(20, Math.min(80, ((clientY - rect.top) / (rect.height - 5)) * 100));
        rs.el.style.height = pct + '%'; rs.el.style.width = '100%';
      } else {
        var pctH = Math.max(20, Math.min(80, ((clientX - rect.left) / (rect.width - 5)) * 100));
        rs.el.style.width = pctH + '%'; rs.el.style.height = '100%';
      }
    }

    function onResizeMove(e) {
      if (!resizeState) return;
      if (resizeState.raf) return;
      resizeState.raf = requestAnimationFrame(function(){
        resizeState.raf = null;
        resizeRAF(e);
        if (editor) editor.refresh();
      });
    }

    function startResize(e) {
      var handle = resizeHandle.value;
      var el = panelEditor.value;
      var overlay = resizeOverlay.value;
      var main = runnerMain.value;
      if (!handle || !el || !overlay || !main) return;

      handle.classList.add('active');
      overlay.classList.add('active');
      var cursor = window.innerWidth <= 768 ? 'row-resize' : 'col-resize';
      overlay.style.cursor = cursor;
      document.body.classList.add('resize-active');
      document.body.style.cursor = cursor;

      resizeState = { rect: main.getBoundingClientRect(), el: el, raf: null };
      e.preventDefault();
    }

    function stopResize() {
      if (!resizeState) return;
      if (resizeState.raf) { cancelAnimationFrame(resizeState.raf); }

      var handle = resizeHandle.value;
      if (handle) handle.classList.remove('active');

      var overlay = resizeOverlay.value;
      if (overlay) { overlay.classList.remove('active'); overlay.style.cursor = ''; }

      document.body.classList.remove('resize-active');
      document.body.style.cursor = '';
      resizeState = null;
    }

    // ---- Theme ----
    function toggleTheme() {
      var html = document.documentElement;
      var cur = html.getAttribute('data-theme');
      var next = cur === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);

      var cmTheme = next === 'dark' ? 'dracula' : 'default';
      if (editor) editor.setOption('theme', cmTheme);

      themeBtn.value = next === 'dark' ? '☀' : '☾';
      try { localStorage.setItem('jsrunner_theme', next); } catch(e) {}
    }

    function toggleAuto() {
      autoRun.value = !autoRun.value;
      try { localStorage.setItem('jsrunner_auto', String(autoRun.value)); } catch(e) {}
    }

    // ---- Storage ----
    function saveStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ code: editor.getValue() }));
      } catch(e) {}
    }

    function restoreStorage() {
      try {
        var saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved && saved.code) {
          editor.setValue(saved.code);
          return true;
        }
      } catch(e) {}
      return false;
    }

    function goHome() {
      window.location.href = '/';
    }

    // ---- Keyboard shortcuts ----
    function onKeydown(e) {
      var tag = e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

      var ctrl = e.ctrlKey || e.metaKey;
      if (ctrl && (e.key === 'Enter' || e.key === 's')) { e.preventDefault(); runCode(); }
      if (ctrl && e.shiftKey && e.key === 'F') { e.preventDefault(); formatCode(); }
    }

    // ---- Init ----
    onMounted(function () {
      if (typeof CodeMirror === 'undefined') return;

      editor = CodeMirror(editorBody.value, cmOpts());
      editor.setValue(DEFAULT_CODE);

      editor.on('change', function(){
        if (autoRun.value) { clearTimeout(runTimer); runTimer = setTimeout(runCode, 500); }
        updateStats();
        saveStorage();
      });

      restoreStorage();
      updateStats();
      runCode();

      document.addEventListener('mousemove', onResizeMove);
      document.addEventListener('mouseup', stopResize);
      document.addEventListener('touchmove', onResizeMove);
      document.addEventListener('touchend', stopResize);
      document.addEventListener('keydown', onKeydown);

      // 恢复已保存的主题
      try {
        if (localStorage.getItem('jsrunner_theme') === 'dark') toggleTheme();
      } catch(e) {}
      // 恢复自动运行开关
      try {
        if (localStorage.getItem('jsrunner_auto') === 'false') autoRun.value = false;
      } catch(e) {}

      setTimeout(function(){
        if (editor) {
          editor.refresh();
          editor.focus();
        }
      }, 100);
    });

    return {
      autoRun: autoRun,
      totalLines: totalLines,
      statusText: statusText,
      donateVisible: donateVisible,
      themeBtn: themeBtn,
      editorBody: editorBody,
      runnerMain: runnerMain,
      panelEditor: panelEditor,
      resizeHandle: resizeHandle,
      resizeOverlay: resizeOverlay,
      previewFrame: previewFrame,
      runCode: runCode,
      formatCode: formatCode,
      minifyCode: minifyCode,
      toggleTheme: toggleTheme,
      toggleAuto: toggleAuto,
      goHome: goHome,
      startResize: startResize
    };
  }
});

app.use(ElementPlus);
app.mount('#app');
</script>
