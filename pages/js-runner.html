<script>
(function() {
'use strict';

// ============================================================
//  Default Code
// ============================================================
var DEFAULT_CODE = [
'<!DOCTYPE html>',
'<html lang="zh-CN">',
'<head>',
'  <meta charset="UTF-8">',
'  <meta name="viewport" content="width=device-width, initial-scale=1.0">',
'  <title>JS Runner Demo</title>',
'  <style>',
'    body {',
'      font-family: system-ui, -apple-system, sans-serif;',
'      max-width: 600px;',
'      margin: 40px auto;',
'      padding: 0 20px;',
'      background: #f5f5f5;',
'      color: #333;',
'    }',
'    h1 { font-size: 28px; color: #1a1a2e; margin-bottom: 8px; }',
'    p { color: #666; margin-bottom: 16px; }',
'    #demo-btn {',
'      padding: 10px 24px;',
'      background: #4f46e5;',
'      color: #fff;',
'      border: none;',
'      border-radius: 6px;',
'      font-size: 14px;',
'      font-weight: 600;',
'      cursor: pointer;',
'      transition: background 0.2s;',
'    }',
'    #demo-btn:hover { background: #4338ca; }',
'    #counter {',
'      margin-top: 16px;',
'      font-size: 36px;',
'      font-weight: 700;',
'      color: #1a1a2e;',
'    }',
'  </style>',
'</head>',
'<body>',
'  <h1>Hello, JS Runner!</h1>',
'  <p>在左侧编辑 HTML / CSS / JS 代码，右侧实时预览。</p>',
'  <button id="demo-btn">Click Me</button>',
'  <div id="counter">0</div>',
'',
'  <script>',
'    let count = 0;',
'    const btn = document.getElementById("demo-btn");',
'    const counter = document.getElementById("counter");',
'',
'    btn.addEventListener("click", () => {',
'      count++;',
'      counter.textContent = count;',
'      console.log("Clicked! Count: " + count);',
'    });',
'',
'    console.log("JS Runner ready 🚀");',
'  <\x2Fscript>',
'</body>',
'</html>',
''].join('\n');

// ============================================================
//  State
// ============================================================
var editor;
var autoRun = true;
var runTimer = null;
var STORAGE_KEY = 'jsrunner_v4';

// ============================================================
//  Shortcuts
// ============================================================
var $ = function(s){return document.querySelector(s);};

// ============================================================
//  Initialize Editor
// ============================================================
function cmOpts() {
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  return {
    mode: 'htmlmixed',
    theme: isDark ? 'dracula' : 'default',
    lineNumbers: true,
    matchBrackets: true,
    autoCloseBrackets: true,
    styleActiveLine: true,
    foldGutter: true,
    gutters: ['CodeMirror-linenumbers','CodeMirror-foldgutter'],
    indentUnit: 2,
    tabSize: 2,
    indentWithTabs: false,
    extraKeys: {
      'Ctrl-Enter': runCode, 'Cmd-Enter': runCode,
      'Ctrl-S': runCode,     'Cmd-S': runCode,
      'Shift-Alt-F': formatCode
    }
  };
}

editor = CodeMirror(document.getElementById('editor-body'), cmOpts());
editor.setValue(DEFAULT_CODE);

editor.on('change', function(){
  if (autoRun) { clearTimeout(runTimer); runTimer = setTimeout(runCode, 500); }
  updateStats();
  saveStorage();
});

// ============================================================
//  Stats
// ============================================================
function updateStats() {
  var el = $('#stat-total');
  if (el) el.textContent = editor.lineCount();
}

// ============================================================
//  Run
// ============================================================
function runCode() {
  clearTimeout(runTimer);
  var iframe = document.getElementById('preview-iframe');
  if (iframe) iframe.srcdoc = editor.getValue();

  var st = $('#status-text'); if (st) st.textContent = 'Output updated';

    var st2 = $('#status-text'); if (st2) st2.textContent = 'Ready';
  }, 2000);
}

// ============================================================
//  Format (beautify entire HTML document)
// ============================================================

/**
 * Format CSS content within <style> blocks.
 */
function _formatCss(css) {
  // Remove leading/trailing whitespace while preserving internal structure
  css = css.trim();
  if (!css) return css;

  var result = '';
  var indent = 0;
  var indentStr = '  ';
  // Tokenize: comments, blocks, rules
  var i = 0;
  while (i < css.length) {
    // Comment
    if (css[i] === '/' && css[i+1] === '*') {
      var end = css.indexOf('*/', i + 2);
      if (end === -1) { result += css.substring(i); break; }
      result += '\n' + indentStr.repeat(indent) + css.substring(i, end + 2);
      i = end + 2;
      continue;
    }
    // Opening brace
    if (css[i] === '{') {
      result += ' {\n';
      indent++;
      i++;
      // Skip whitespace after {
      while (i < css.length && /\s/.test(css[i])) i++;
      continue;
    }
    // Closing brace
    if (css[i] === '}') {
      indent = Math.max(0, indent - 1);
      result += '\n' + indentStr.repeat(indent) + '}';
      i++;
      // Skip whitespace after }
      while (i < css.length && /\s/.test(css[i])) i++;
      continue;
    }
    // Semicolon (property separator)
    if (css[i] === ';') {
      result += ';\n' + indentStr.repeat(indent);
      i++;
      while (i < css.length && /\s/.test(css[i])) i++;
      continue;
    }
    // Comma (selector separator)
    if (css[i] === ',') {
      result += ',\n' + indentStr.repeat(indent);
      i++;
      while (i < css.length && /\s/.test(css[i])) i++;
      continue;
    }
    // Colon (property-value separator)
    if (css[i] === ':') {
      result += ': ';
      i++;
      while (i < css.length && /\s/.test(css[i])) i++;
      continue;
    }
    // Whitespace - collapse to single space except at line start
    if (/\s/.test(css[i])) {
      // Check if we just had a newline from a ; or }
      if (result && result[result.length - 1] === '\n') {
        // Already at line start, just skip whitespace
        i++;
        continue;
      }
      var ws = '';
      while (i < css.length && /\s/.test(css[i])) { ws += css[i]; i++; }
      if (ws.indexOf('\n') !== -1) {
        result += '\n' + indentStr.repeat(indent);
      } else if (result && result[result.length - 1] !== ' ') {
        result += ' ';
      }
      continue;
    }
    // Regular character
    result += css[i];
    i++;
  }

  return result.replace(/\n\s*\n\s*\n/g, '\n\n').replace(/^\n+/, '').trim();
}

/**
 * Format HTML document: properly indent tags, beautify inline <style> and <script> blocks.
 */
function formatHtml(html) {
  // === Step 1: Extract and format style blocks ===
  var styleBlocks = [];
  html = html.replace(new RegExp('(<style\\b[^>]*>)([\\s\\S]*?)(<\\/style>)', 'gi'), function(m, open, content, close) {
    var formatted = _formatCss(content);
    var idx = styleBlocks.length;
    styleBlocks.push(open + '\n' + formatted + '\n' + close);
    return '\x00STYLE' + idx + '\x00';
  });

  // === Step 2: Extract and format script blocks ===
  var scriptBlocks = [];
  html = html.replace(new RegExp('(<script\\b[^>]*>)([\\s\\S]*?)(<\\/script>)', 'gi'), function(m, open, content, close) {
    // Skip scripts with src attribute
    if (/src\s*=/.test(open)) return m;
    // Skip non-JS script types
    var typeMatch = open.match(/type\s*=\s*["']([^"']*)["']/i);
    if (typeMatch && !/^(text\/javascript|module|application\/javascript)$/i.test(typeMatch[1])) return m;

    var formatted = content;
    if (typeof window.js_beautify === 'function') {
      try {
        formatted = window.js_beautify(content, {
          indent_size: 2, indent_char: ' ', max_preserve_newlines: 2,
          preserve_newlines: true, brace_style: 'collapse',
          space_before_conditional: true, unescape_strings: false
        });
      } catch(e) { /* keep original */ }
    }
    var idx = scriptBlocks.length;
    scriptBlocks.push(open + '\n' + formatted.trim() + '\n' + close);
    return '\x00SCRIPT' + idx + '\x00';
  });

  // === Step 3: Format HTML structure ===
  var voidTags = { area:1,base:1,br:1,col:1,embed:1,hr:1,img:1,input:1,link:1,meta:1,param:1,source:1,track:1,wbr:1 };
  var result = '';
  var indent = 0;
  var indentStr = '  ';
  // Tokenize: split on tag boundaries, preserve placeholders
  var tokenRe = /(<[^>]+>|\x00(?:STYLE|SCRIPT)\d+\x00)/g;
  var tokens = [];
  var lastIdx = 0;
  var m;
  while ((m = tokenRe.exec(html)) !== null) {
    if (m.index > lastIdx) {
      var text = html.substring(lastIdx, m.index);
      var trimmed = text.trim();
      if (trimmed) tokens.push({ type: 'text', value: trimmed });
    }
    var raw = m[0];
    if (raw.charCodeAt(0) === 0) {
      tokens.push({ type: 'block', value: raw });
    } else {
      tokens.push({ type: 'tag', value: raw });
    }
    lastIdx = m.index + m[0].length;
  }
  if (lastIdx < html.length) {
    var tail = html.substring(lastIdx).trim();
    if (tail) tokens.push({ type: 'text', value: tail });
  }

  // Process tokens
  var prevType = null;
  for (var i = 0; i < tokens.length; i++) {
    var t = tokens[i];
    if (t.type === 'block') {
      // Restore placeholder block content, indented
      var blockMatch = t.value.match(/^\x00(STYLE|SCRIPT)(\d+)\x00$/);
      if (blockMatch) {
        var kind = blockMatch[1];
        var idx = parseInt(blockMatch[2]);
        var blockContent = kind === 'STYLE' ? styleBlocks[idx] : scriptBlocks[idx];
        // Indent the block content to match current level
        var lines = blockContent.split('\n');
        result += '\n' + indentStr.repeat(indent) + lines[0];
        for (var li = 1; li < lines.length; li++) {
          result += '\n' + (lines[li] ? indentStr.repeat(indent + 1) + lines[li] : '');
        }
      }
      prevType = 'block';
      continue;
    }

    if (t.type === 'text') {
      if (prevType === 'tag') {
        result += '\n' + indentStr.repeat(indent) + t.value;
      } else {
        result += t.value;
      }
      prevType = 'text';
      continue;
    }

    // t.type === 'tag'
    var tag = t.value;

    // DOCTYPE
    if (/^<!/i.test(tag)) {
      result += (result ? '\n' : '') + tag;
      prevType = 'tag';
      continue;
    }

    // Closing tag
    if (tag[1] === '/') {
      indent = Math.max(0, indent - 1);
      result += '\n' + indentStr.repeat(indent) + tag;
      prevType = 'tag';
      continue;
    }

    // Self-closing tag
    if (/\/\s*>$/.test(tag)) {
      result += '\n' + indentStr.repeat(indent) + tag;
      prevType = 'tag';
      continue;
    }

    // Get tag name
    var tagMatch = tag.match(/^<(\w+)/);
    if (!tagMatch) {
      result += '\n' + indentStr.repeat(indent) + tag;
      prevType = 'tag';
      continue;
    }
    var tagName = tagMatch[1].toLowerCase();

    // Void element
    if (voidTags[tagName]) {
      result += '\n' + indentStr.repeat(indent) + tag;
      prevType = 'tag';
      continue;
    }

    // Opening tag
    result += '\n' + indentStr.repeat(indent) + tag;
    prevType = 'tag';

    // Check if this opening tag actually gets closed later in the source
    // Only increase indent if there's content between open and close
    indent++;
  }

  return result.replace(/^\n+/, '').trim() + '\n';
}

function formatCode() {
  var code = editor.getValue();
  if (!code.trim()) return;
  try {
    var formatted = formatHtml(code);
    editor.setValue(formatted);
    var st = $('#status-text'); if (st) st.textContent = '格式化完成';
  } catch(e) {
    var st2 = $('#status-text'); if (st2) st2.textContent = '格式化失败: ' + e.message;
  }
}

// ============================================================
//  Minify (compress entire HTML document)
// ============================================================

/**
 * Minify CSS content: remove comments, collapse whitespace.
 */
function _minifyCss(css) {
  // Remove comments
  css = css.replace(/\/\*[\s\S]*?\*\//g, '');
  // Collapse all whitespace sequences
  css = css.replace(/\s+/g, ' ');
  // Remove spaces around structural characters
  css = css.replace(/\s*([{}:;,>+~()])\s*/g, '$1');
  // Remove unnecessary semicolons before closing brace
  css = css.replace(/;\s*}/g, '}');
  // Remove leading/trailing whitespace from selectors and values
  css = css.replace(/^\s+|\s+$/g, '');
  return css;
}

function minifyHtml(html) {
  var result = html;

  // === Step 1: Protect <textarea>, <pre>, <code> content ===
  var preserveBlocks = [];
  var preserveRe = new RegExp('(<(?:textarea|pre|code)\\b[^>]*>)([\\s\\S]*?)(<\\/(?:textarea|pre|code)>)', 'gi');
  result = result.replace(preserveRe, function(m) {
    var idx = preserveBlocks.length;
    preserveBlocks.push(m);
    return '\x00PRESERVE' + idx + '\x00';
  });

  // === Step 2: Remove HTML comments (keep IE conditional comments) ===
  result = result.replace(new RegExp('<!--(?!\\[if\\s)[\\s\\S]*?-->', 'g'), '');

  // === Step 3: Minify inline script blocks ===
  var scriptBlockRe = new RegExp('(<script\\b[^>]*>)([\\s\\S]*?)(<\\/script>)', 'gi');
  result = result.replace(scriptBlockRe, function(m, open, content, close) {
    // Skip scripts with src attribute
    if (/src\s*=/.test(open)) return m;
    // Skip non-JS script types
    var typeMatch = open.match(/type\s*=\s*["']([^"']*)["']/i);
    if (typeMatch && !/^(text\/javascript|module|application\/javascript)$/i.test(typeMatch[1])) return m;

    var minified = content;
    if (typeof Terser !== 'undefined' && Terser.minify_sync) {
      try {
        var result = Terser.minify_sync(content);
        if (result.code) minified = result.code;
      } catch(e) { /* keep original */ }
    }
    return open + minified + close;
  });

  // === Step 4: Minify inline style blocks ===
  var styleBlockRe = new RegExp('(<style\\b[^>]*>)([\\s\\S]*?)(<\\/style>)', 'gi');
  result = result.replace(styleBlockRe, function(m, open, content, close) {
    return open + _minifyCss(content) + close;
  });

  // === Step 5: Collapse HTML whitespace ===
  // Remove whitespace between tags
  result = result.replace(/>\s+</g, '><');
  // Collapse multiple spaces into one (in text nodes)
  result = result.replace(/\s{2,}/g, ' ');
  // Remove leading/trailing whitespace on each line
  result = result.replace(/^\s+|\s+$/gm, '');

  // === Step 6: Restore preserved blocks ===
  result = result.replace(/\x00PRESERVE(\d+)\x00/g, function(m, idx) {
    var block = preserveBlocks[parseInt(idx)];
    // Minify preserved blocks too (just collapse whitespace between their tags)
    return block.replace(/>\s+</g, '><');
  });

  // Remove blank lines
  result = result.replace(/\n\s*\n/g, '\n');

  return result.trim();
}

function minifyCode() {
  var code = editor.getValue();
  if (!code.trim()) return;
  try {
    var minified = minifyHtml(code);
    editor.setValue(minified);
    var st = $('#status-text'); if (st) st.textContent = '压缩完成';
  } catch(e) {
    var st2 = $('#status-text'); if (st2) st2.textContent = '压缩失败: ' + e.message;
  }
}

// ============================================================
//  Resize (horizontal: editor | output)
// ============================================================
var resizeState = null;

function resizeRAF(e) {
  if (!resizeState) return;
  var clientX, clientY;
  if (e.touches) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
  else { clientX = e.clientX; clientY = e.clientY; }

  var rs = resizeState, rect = rs.rect;

  if (window.innerWidth <= 768) {
    var pct = Math.max(20, Math.min(80, ((clientY - rect.top) / (rect.height - 5)) * 100));
    rs.el.style.height = pct + '%'; rs.el.style.width = '100%';
  } else {
    var pctH = Math.max(20, Math.min(80, ((clientX - rect.left) / (rect.width - 5)) * 100));
    rs.el.style.width = pctH + '%'; rs.el.style.height = '100%';
  }
}

function onResizeMove(e) {
  if (!resizeState) return;
  if (resizeState.raf) return;
  resizeState.raf = requestAnimationFrame(function(){
    resizeState.raf = null;
    resizeRAF(e);
    if (editor) editor.refresh();
  });
}

function startResize(e) {
  var handle = $('#resize-handle');
  var el = $('#panel-editor');
  var overlay = $('#resize-overlay');
  var main = $('#runner-main');
  if (!handle || !el || !overlay || !main) return;

  handle.classList.add('active');
  overlay.classList.add('active');
  var cursor = window.innerWidth <= 768 ? 'row-resize' : 'col-resize';
  overlay.style.cursor = cursor;
  document.body.classList.add('resize-active');
  document.body.style.cursor = cursor;

  resizeState = { rect: main.getBoundingClientRect(), el: el, raf: null };
  e.preventDefault();
}

function stopResize() {
  if (!resizeState) return;
  if (resizeState.raf) { cancelAnimationFrame(resizeState.raf); }

  var handle = $('#resize-handle');
  if (handle) handle.classList.remove('active');

  var overlay = $('#resize-overlay');
  if (overlay) { overlay.classList.remove('active'); overlay.style.cursor = ''; }

  document.body.classList.remove('resize-active');
  document.body.style.cursor = '';
  resizeState = null;
}

// Mouse events
var hHandle = $('#resize-handle');
if (hHandle) { hHandle.addEventListener('mousedown', function(e){ startResize(e); }); }

document.addEventListener('mousemove', onResizeMove);
document.addEventListener('mouseup', stopResize);

// Touch events
if (hHandle) { hHandle.addEventListener('touchstart', function(e){ startResize(e); }); }

document.addEventListener('touchmove', onResizeMove);
document.addEventListener('touchend', stopResize);

// ============================================================
//  Theme
// ============================================================
function toggleTheme() {
  var html = document.documentElement;
  var cur = html.getAttribute('data-theme');
  var next = cur === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);

  var cmTheme = next === 'dark' ? 'dracula' : 'default';
  if (editor) editor.setOption('theme', cmTheme);

  var btn = $('#btn-theme'); if (btn) btn.textContent = next === 'dark' ? '☀' : '☾';
  try { localStorage.setItem('jsrunner_theme', next); } catch(e) {}
}

var btnTheme = $('#btn-theme');
if (btnTheme) btnTheme.addEventListener('click', toggleTheme);

// Restore saved theme
(function(){
  try {
    if (localStorage.getItem('jsrunner_theme') === 'dark') toggleTheme();
  } catch(e) {}
})();

// ============================================================
//  Auto-run toggle
// ============================================================
var btnAuto = $('#btn-auto');
if (btnAuto) {
  btnAuto.addEventListener('click', function(){
    autoRun = !autoRun;
    btnAuto.classList.toggle('active', autoRun);
    btnAuto.textContent = autoRun ? 'Auto' : 'Manual';
    try { localStorage.setItem('jsrunner_auto', String(autoRun)); } catch(e) {}
  });
}

(function(){
  try {
    if (localStorage.getItem('jsrunner_auto') === 'false') {
      autoRun = false;
      var b = $('#btn-auto');
      if (b) { b.classList.remove('active'); b.textContent = 'Manual'; }
    }
  } catch(e) {}
})();

// ============================================================
//  Button bindings
// ============================================================
var btnRun = $('#btn-run'); if (btnRun) btnRun.addEventListener('click', runCode);
var btnFmt = $('#btn-format'); if (btnFmt) btnFmt.addEventListener('click', formatCode);
var btnMin = $('#btn-minify'); if (btnMin) btnMin.addEventListener('click', minifyCode);

// Donate
var donateWx = $('#donate-wx'); if (donateWx) donateWx.addEventListener('click', function(){ $('#donate-dialog').classList.add('active'); });
var donateZfb = $('#donate-zfb'); if (donateZfb) donateZfb.addEventListener('click', function(){ $('#donate-dialog').classList.add('active'); });
var donateClose = $('#donate-dialog-close'); if (donateClose) donateClose.addEventListener('click', function(){ $('#donate-dialog').classList.remove('active'); });
var donateOverlay = $('#donate-dialog'); if (donateOverlay) donateOverlay.addEventListener('click', function(e){ if (e.target === donateOverlay) donateOverlay.classList.remove('active'); });

// ============================================================
//  Keyboard shortcuts
// ============================================================
document.addEventListener('keydown', function(e){
  // Don't intercept when focus is in another input
  var tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

  var ctrl = e.ctrlKey || e.metaKey;
  if (ctrl && (e.key === 'Enter' || e.key === 's')) { e.preventDefault(); runCode(); }
  if (ctrl && e.shiftKey && e.key === 'F') { e.preventDefault(); formatCode(); }
});

// ============================================================
//  Storage
// ============================================================
function saveStorage() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ code: editor.getValue() }));
  } catch(e) {}
}

function restoreStorage() {
  try {
    var saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved && saved.code) {
      editor.setValue(saved.code);
      return true;
    }
  } catch(e) {}
  return false;
}

// ============================================================
//  Init
// ============================================================
function init() {
  restoreStorage();
  updateStats();
  runCode();
  setTimeout(function(){
    if (editor) {
      editor.refresh();
      editor.focus();
    }
  }, 100);
}

// Wait for CodeMirror to be fully available before init
if (typeof CodeMirror !== 'undefined') {
  init();
} else {
  var checkCm = setInterval(function(){
    if (typeof CodeMirror !== 'undefined') {
      clearInterval(checkCm);
      init();
    }
  }, 50);
  setTimeout(function(){ clearInterval(checkCm); }, 5000);
}

})();
</script>
